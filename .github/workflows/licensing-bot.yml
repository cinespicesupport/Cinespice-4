name: Test access bot
on:
  workflow_dispatch:
  push:
    paths: ['licensing-bot/**', 'scripts/configure-access.py', 'Tests/Fixtures/**', '.github/workflows/licensing-bot.yml']
  pull_request:
    paths: ['licensing-bot/**', 'scripts/configure-access.py', 'Tests/Fixtures/**', '.github/workflows/licensing-bot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: licensing-bot/requirements.txt
      - run: python -m pip install -r licensing-bot/requirements.txt
      - run: python -m unittest discover -s licensing-bot/tests -v
        env:
          PYTHONPATH: licensing-bot

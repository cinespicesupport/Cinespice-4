name: Tevee
options:
  bundleIdPrefix: app.tevee
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
packages:
  TDLibFramework:
    url: https://github.com/Swiftgram/TDLibFramework
    exactVersion: 1.8.68-c15d3f5a
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: "NO"
    INFOPLIST_KEY_CFBundleDisplayName: Cinespice
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Cinespice · Masalaots"
    INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
    INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Tevee:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/TelegramBuildCredentials.plist
        optional: true
        buildPhase: resources
      - path: Resources/CinespiceAccess.json
        optional: true
        buildPhase: resources
    dependencies:
      - sdk: libsqlite3.tbd
      - package: TDLibFramework
        product: TDLibFramework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.tevee.ios
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
